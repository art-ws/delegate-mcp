name: Release

# Every invocation is manual. Preview is the default; the owner selects false
# only after reviewing the accepted source, artifact, version and release gates.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: verify package and compute version/notes without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: delegate-mcp-release
  cancel-in-progress: false

jobs:
  preview:
    name: Verify artifact and preview release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Runner only; the published package retains Node >=20 support.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Report release tool versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Build production artifact
        run: npm run build
      - name: Verify ordinary packed artifact and installed bin
        run: node docs/release/verify-artifact.mjs
      - name: Preview reachable history without release credentials or publication plugins
        run: node docs/release/preview.mjs

  release:
    name: Publish owner-approved release
    needs: preview
    if: github.ref == 'refs/heads/main' && inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # version/CHANGELOG commit, tag and GitHub Release
      issues: write # existing GitHub plugin success/failure comments and labels
      pull-requests: write # existing GitHub plugin comments on released PRs
      id-token: write # provenance; trusted-publisher migration remains external
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Report release tool versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Build production artifact
        run: npm run build
      - name: Verify ordinary packed artifact and installed bin
        run: node docs/release/verify-artifact.mjs
      # Preserve token auth until this package's trusted publisher is confirmed.
      # See docs/release/README.md for the external setup and evidence limits.
      - name: semantic-release (real publication)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --no-install semantic-release
